<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.1/control_utils.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.1/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.1/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.2/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.2/pose.js" crossorigin="anonymous"></script>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="./html_css.css" />
  <script src="./html_js.js"></script>
</head>

<body>
  <div class="header">
    <img alt="kafka logo" class="logo" src="./kafka_avatar.jpg" width="90" height="90" />
    <div class="hitem">Tensorflow.js Demo</div>
    <div>
      <button class="menuBtn" onClick="handleClick('face')">人臉辨識 </button>
      <button class="menuBtn" onClick="handleClick('facemesh')">人臉網格 </button>
      <button class="menuBtn" onClick="handleClick('hands')">手掌辨識 </button>
      <button class="menuBtn menuDisable">人體姿勢 </button>
      <button class="menuBtn" onClick="handleClick('holistic')">整體辨識 </button>
      <button class="menuBtn" onClick="handleClick('others')">其它應用 </button>
    </div>
  </div>

  <div class="container" style="margin-top: 20px;">
    <div class="row gx-2 gy-2">
      <div class="col-md-6">
        <button type="button" class="btn btn-success btn-lg" style="padding: 10px;" onClick="vidStart()">啟動</button>
        <button type="button" class="btn btn-success btn-lg" style="padding: 10px;" onClick="vidStop()">停止</button>
      </div>
    </div>

    <div class="row gx-4 gy-4">
      <div class="col-md-6">
        <div class="card" style="min-width: 20rem;" >
          <div class="card-title-custom">
            <h5 class="card-title mb-0">Camera Input</h5>
          </div>
          <div class="card-body" style="padding: 0;">
            <video id="input_video1" width="480px" height="400px" style="padding: 0;"></video>
          </div>
        </div>
      </div> <!-- /col -->
      <div class="col-md-6">
        <div class="card" style="min-width: 20rem;">
          <div class="card-title-custom">
            <h5 class="card-title mb-0">Mediapipe Detection Output</h5>
          </div>
          <div class="card-body">
            <canvas id="output1" width="480px" height="400px"></canvas>
          </div>
        </div>
      </div> <!-- /col -->
    </div> <!-- /row -->
    
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div> <!-- /container -->

  <div id="control1" style="visibility: hidden;" class="control1"></div>  
</body>
<script>
const video1 = document.getElementById('input_video1');
const out1 = document.getElementById('output1');
const controlsElement1 = document.getElementById('control1');
const canvasCtx1 = out1.getContext('2d');
const fpsControl = new FPS();

function zColor(data) {
  const z = clamp(data.from.z + 0.5, 0, 1);
  return `rgba(0, ${255 * z}, ${255 * (1 - z)}, 1)`;
}

function onResultsPose(results) {
  document.body.classList.add('loaded');
  fpsControl.tick();

  canvasCtx1.save();
  canvasCtx1.clearRect(0, 0, out1.width, out1.height);
  canvasCtx1.drawImage(
      results.image, 0, 0, out1.width, out1.height);
  drawConnectors(
      canvasCtx1, results.poseLandmarks, POSE_CONNECTIONS, {
        color: (data) => {
          const x0 = out1.width * data.from.x;
          const y0 = out1.height * data.from.y;
          const x1 = out1.width * data.to.x;
          const y1 = out1.height * data.to.y;

          const z0 = clamp(data.from.z + 0.5, 0, 1);
          const z1 = clamp(data.to.z + 0.5, 0, 1);

          const gradient = canvasCtx1.createLinearGradient(x0, y0, x1, y1);
          gradient.addColorStop(
              0, `rgba(0, ${255 * z0}, ${255 * (1 - z0)}, 1)`);
          gradient.addColorStop(
              1.0, `rgba(0, ${255 * z1}, ${255 * (1 - z1)}, 1)`);
          return gradient;
        }
      });
  drawLandmarks(
      canvasCtx1,
      Object.values(POSE_LANDMARKS_LEFT)
          .map(index => results.poseLandmarks[index]),
      {color: zColor, fillColor: '#FF0000'});
  drawLandmarks(
      canvasCtx1,
      Object.values(POSE_LANDMARKS_RIGHT)
          .map(index => results.poseLandmarks[index]),
      {color: zColor, fillColor: '#00FF00'});
  drawLandmarks(
      canvasCtx1,
      Object.values(POSE_LANDMARKS_NEUTRAL)
          .map(index => results.poseLandmarks[index]),
      {color: zColor, fillColor: '#AAAAAA'});
  canvasCtx1.restore();
}

const pose = new Pose({locateFile: (file) => {
  return `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.2/${file}`;
}});
pose.onResults(onResultsPose);

var myCamara = null;
async function video_frame_cb(video1) {
  await pose.send({image: video1});
}

function vidStart() {
  if(myCamara) return;
  myCamara = startCamera(video1, video_frame_cb)
  myCamara.start();
}
function vidStop() {
  if(!myCamara) return;
  stopCamera(myCamara)
  myCamara = null;
}

new ControlPanel(controlsElement1, {
      selfieMode: true,
      upperBodyOnly: false,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    })
    .add([
      new StaticText({title: 'MediaPipe Pose'}),
      fpsControl,
      new Toggle({title: 'Selfie Mode', field: 'selfieMode'}),
      new Toggle({title: 'Upper-body Only', field: 'upperBodyOnly'}),
      new Toggle({title: 'Smooth Landmarks', field: 'smoothLandmarks'}),
      new Slider({
        title: 'Min Detection Confidence',
        field: 'minDetectionConfidence',
        range: [0, 1],
        step: 0.01
      }),
      new Slider({
        title: 'Min Tracking Confidence',
        field: 'minTrackingConfidence',
        range: [0, 1],
        step: 0.01
      }),
    ])
    .on(options => {
      video1.classList.toggle('selfie', options.selfieMode);
      pose.setOptions(options);
    });
</script>
</html>
