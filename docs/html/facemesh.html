<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.1/control_utils.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.1/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.1/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.1/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.1/face_mesh.js" crossorigin="anonymous"></script>
  <script src="./webcam-easy.js"></script>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="./html_css.css" />
  <script src="./html_js.js"></script>
</head>

<body>
  <div class="header">
    <img alt="kafka logo" class="logo" src="./kafka_avatar.jpg" width="90" height="90" />
    <div class="hitem">Tensorflow.js Demo</div>
    <div>
      <button class="menuBtn" onClick="handleClick('face')">人臉辨識 </button>
      <button class="menuBtn menuDisable">人臉網格 </button>
      <button class="menuBtn" onClick="handleClick('hands')">手掌辨識 </button>
      <button class="menuBtn" onClick="handleClick('pose')">人體姿勢 </button>
      <button class="menuBtn" onClick="handleClick('holistic')">整體辨識 </button>
      <button class="menuBtn" onClick="handleClick('others')">其它應用 </button>
    </div>
  </div>

  <div class="container" style="margin-top: 20px;">
    <div class="row gx-2 gy-2">
      <div class="col-md-6">
        <button type="button" class="btn btn-success btn-lg" style="padding: 10px;" onClick="vidStart()">啟動</button>
        <button type="button" class="btn btn-success btn-lg" style="padding: 10px;" onClick="vidStop()">停止</button>
        <button type="button" class="btn btn-success btn-lg" style="padding: 10px;" onClick="vidSwitch()">切換鏡頭</button>
      </div>
    </div>

    <div class="row gx-4 gy-4">
      <div class="col-md-6">
        <div class="card" style="min-width: 20rem;" >
          <div class="card-title-custom">
            <h5 class="card-title mb-0">Camera Input</h5>
          </div>
          <div class="card-body" style="padding: 0;">
            <video id="input_video1" style="object-fit: cover;"></video>
          </div>
        </div>
      </div> <!-- /col -->
      <div class="col-md-6">
        <div class="card" style="min-width: 20rem;">
          <div class="card-title-custom">
            <h5 class="card-title mb-0">Mediapipe Detection Output</h5>
          </div>
          <div class="card-body" style="padding:0;">
            <canvas id="output1" style="width:100%;height:auto;"></canvas>
          </div>
        </div>
      </div> <!-- /col -->
      
      <div class="col-md-12">
        <div class="card" style="min-width: 20rem;">
          <div class="card-title-custom">
            <h5 class="card-title mb-0">Camera Info.</h5>
          </div>
          <div class="card-body" style="padding: 0;">
            <textarea id="myTextarea" rows="12" class="full-width-textarea">
            </textarea>
          </div>
        </div>
      </div> <!-- /col -->
    </div> <!-- /row -->
    
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div> <!-- /container -->

  <div id="control1" style="visibility: hidden;" class="control1"></div>
</body>
<script>
const video1 = document.getElementById('input_video1');
const out1 = document.getElementById('output1');
const controlsElement1 = document.getElementById('control1');
const myTextLog = document.getElementById('myTextarea');
const canvasCtx = out1.getContext('2d');
const fpsControl = new FPS();
const snapSound = null; //document.getElementById('snapSound');
const camOption = {
  width: (output1.width || 640), 
  height: 480 
};
const targetFPS = 30;
var videoRatio = video1.width / video1.height;
var canvasRatio = out1.width / out1.height;
var vidoeInfo;
var myCamara = null;
var webcam = new Webcam(video1, 'user', out1, snapSound);
var lastTime = 0;

function onResultsFaceMesh(results) {
  //document.body.classList.add('loaded');
  fpsControl.tick();

  //canvasCtx.save();
  canvasCtx.clearRect(0, 0, out1.width, out1.height);
  canvasCtx.drawImage(
      results.image, 0, 0, out1.width, out1.height);
  if (results.multiFaceLandmarks) {
    for (const landmarks of results.multiFaceLandmarks) {
      drawConnectors(
          canvasCtx, landmarks, FACEMESH_TESSELATION,
          {color: '#C0C0C070', lineWidth: 1});
      drawConnectors(
          canvasCtx, landmarks, FACEMESH_RIGHT_EYE,
          {color: '#FF3030'});
      drawConnectors(
          canvasCtx, landmarks, FACEMESH_RIGHT_EYEBROW,
          {color: '#FF3030'});
      drawConnectors(
          canvasCtx, landmarks, FACEMESH_LEFT_EYE,
          {color: '#30FF30'});
      drawConnectors(
          canvasCtx, landmarks, FACEMESH_LEFT_EYEBROW,
          {color: '#30FF30'});
      drawConnectors(
          canvasCtx, landmarks, FACEMESH_FACE_OVAL,
          {color: '#E0E0E0'});
      drawConnectors(
          canvasCtx, landmarks, FACEMESH_LIPS,
          {color: '#E0E0E0'});
    }
  }
  //canvasCtx.restore();
}

const faceMesh = new FaceMesh({locateFile: (file) => {
  return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.1/${file}`;
}});
faceMesh.onResults(onResultsFaceMesh);

async function video_frame_cb(video1) {
  // make sure video ready
  if (video1.readyState < 2) {
    await new Promise((resolve) => {
      video1.onloadeddata = () => {
        resolve(video1);
      };
    });
  }
    
  let srcX, srcY, srcWidth, srcHeight;

  if (videoRatio > canvasRatio) {
    srcHeight = vidoeInfo.height;
    srcWidth = srcHeight * canvasRatio;
    srcX = (vidoeInfo.width - srcWidth) / 2;
    srcY = 0;
  } else {
    srcWidth = vidoeInfo.width;
    srcHeight = srcWidth / canvasRatio;
    srcX = 0;
    srcY = (vidoeInfo.height - srcHeight) / 2;
  }

  canvasCtx.drawImage(
    video1,
    srcX, srcY, srcWidth, srcHeight,  // 原始尺寸crop
    0, 0, out1.width, out1.height     // 縮小後的尺寸
  );
  await faceMesh.send({image: out1});
}

async function drawVideoFrame(timestamp) {
  if(!video1.srcObject) return;
  
  if (!lastTime || timestamp - lastTime >= 1000 / targetFPS) {
    await video_frame_cb(video1);
    lastTime = timestamp;
  }
  requestAnimationFrame(drawVideoFrame);
}

function vidStart() {
  webcam.start()
    .then(result => {
      const deviceId = webcam.selectedDeviceId;
      const vidInfo = webcam.vidoeTrackInfo;
      let active;
      console.log("webcam started", result);
      myTextLog.value = `mode: ${result}\nid: ${deviceId}\n`;
      myTextLog.value += `vidoeInfo: ${vidInfo.width}x${vidInfo.height}\n`;
      myTextLog.value += `videoIn: ${video1.videoWidth}x${video1.videoHeight}\n`;
      webcam.webcamList.forEach(mediaDevice => {
        active = deviceId == mediaDevice.deviceId? "active":""
        myTextLog.value += `cam: ${mediaDevice.label} => ${active}\n`;
      });
      vidoeInfo = vidInfo;
      videoRatio = vidInfo.width / vidInfo.height;
      canvasRatio = out1.width / out1.height;
      
      //out1.width = video1.width;
      //out1.height = video1.height;
      out1.style.width = '100%';
      out1.style.height = 'auto';
      
      requestAnimationFrame(drawVideoFrame);
    })
    .catch(err => {
      console.log(err);
    });
}
function vidStop() {
  webcam.stop(true);
}
function vidSwitch() {
  vidStop();
  let facingMode = webcam.facingMode;
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  console.log("set facingMode:", facingMode);
  delete webcam;
  webcam = new Webcam(video1, facingMode, out1, snapSound);
  vidStart();
}
new ControlPanel(controlsElement1, {
      selfieMode: true,
      maxNumFaces: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    })
    .add([
      new StaticText({title: 'MediaPipe Face Mesh'}),
      fpsControl,
      new Toggle({title: 'Selfie Mode', field: 'selfieMode'}),
      new Slider({
        title: 'Max Number of Faces',
        field: 'maxNumFaces',
        range: [1, 4],
        step: 1
      }),
      new Slider({
        title: 'Min Detection Confidence',
        field: 'minDetectionConfidence',
        range: [0, 1],
        step: 0.01
      }),
      new Slider({
        title: 'Min Tracking Confidence',
        field: 'minTrackingConfidence',
        range: [0, 1],
        step: 0.01
      }),
    ])
    .on(options => {
      video1.classList.toggle('selfie', options.selfieMode);
      faceMesh.setOptions(options);
    });

function vidInit() {
  updateCanvasSize(out1);
  myTextLog.value = `canvas: ${output1.width} x ${output1.height}\n`;
  myTextLog.value += `screenOrientation: ${screenOrientation()}\n`;
  if(screenOrientation() == 'portrait') {
    camOption.height = output1.width * 1.4; // 16:10;
  }
  else {
    camOption.height = output1.width * 0.425; // 16:10
  }

  video1.width = camOption.width;
  video1.height = camOption.height;
  video1.style.width = `${camOption.width}px`;
  video1.style.height = `${camOption.height}px`;
  
  out1.width = camOption.width;
  out1.height = camOption.height;
  out1.style.width = `${camOption.width}px`;
  out1.style.height = `${camOption.height}px`;
}
window.addEventListener('load', function func() {
  vidInit();
});
</script>
</html>
